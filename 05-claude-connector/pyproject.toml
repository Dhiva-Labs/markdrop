[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdrop-mcp"
version = "0.1.0"
description = "Markdrop MCP server from Dhiva Labs — convert anything to Markdown via MarkItDown"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp>=1.9",
  "markitdown[pdf,docx,pptx,xlsx,xls,outlook,youtube-transcription]>=0.1.3",
  "requests",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
markdrop-mcp = "markdrop_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markdrop_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
