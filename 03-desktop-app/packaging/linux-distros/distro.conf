# Package metadata for the Markdrop Studio packages beyond the .deb (.rpm,
# Arch, AppImage, AUR PKGBUILD). Sourced by bash from pack.sh, verify.sh and
# ../arch/aur.sh. Keep it in step with ../build_deb.sh.

NAME=markdrop-studio         # the .deb's package name
APP_NAME=MarkdropStudio      # AppImage file name
GITHUB_REPO=Dhiva-Labs/markdrop
SUMMARY='Convert anything to Markdown'
DESCRIPTION='Markdrop Studio is a drag-and-drop batch converter for PDF, Word, Excel, PowerPoint, EPUB and HTML files, web pages and YouTube links, with a rendered Markdown preview. Conversion runs locally through the bundled markitdown engine.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/markdrop
LICENSE=MIT
LICENSE_FILE=LICENSE         # relative to the repository root, where CI runs pack.sh
ARCH_INDEPENDENT=0

# rpm: library dependencies come from the ELF files (GTK 3 and glibc; the
# PyInstaller engine bundles everything else). Flutter's engine dlopens EGL
# and GLES, so those never show up as NEEDED entries.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# Arch: gtk3 (GTK, GLib, cairo, pango, libepoxy) and libglvnd (EGL, GLES).
ARCH_DEPENDS=(gtk3 libglvnd)

APPIMAGE=1
EXEC=opt/markdrop-studio/md_converter_desktop
DESKTOP=usr/share/applications/markdrop-studio.desktop
ICON=usr/share/icons/hicolor/256x256/apps/markdrop-studio.png
APPRUN_ENV=''                # /usr/bin/markdrop is a plain symlink

# Smoke tests run in each distribution container by verify.sh: the app's own
# --selftest (a GTK window, then one document converted through the bundled
# engine) on four documents, then the window must stay up for SMOKE_SECONDS.
GUI_CMD=markdrop
SMOKE_SECONDS=20
SMOKE_CMD='bash /linux-distros/smoke.sh'
